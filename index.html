<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>족보 해커 (Jokbo Hacker) - 언주중학교 전용</title>
    <!-- Tesseract.js (손글씨 및 이미지 OCR 스캔 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- Chart.js (선생님 출제 스타일 레이더 차트) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-green: #4ade80;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-sub);
        }

        .badge {
            background-color: #0284c7;
            color: white;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 4px;
            vertical-align: middle;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text-sub);
        }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #334155;
            color: var(--text-color);
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            border: 1px dashed var(--accent-color);
            transition: 0.3s;
        }

        .file-upload-btn:hover {
            background-color: #475569;
        }

        .uploaded-list {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--accent-green);
        }

        button.btn-primary {
            width: 100%;
            padding: 15px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background-color: #0369a1;
        }

        .ocr-loading {
            display: none;
            color: var(--accent-color);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* 결과 화면 디자인 */
        #result-section {
            display: none;
        }

        .chart-container {
            position: relative;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }

        .timeline-item {
            border-left: 3px solid var(--accent-color);
            padding-left: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: var(--accent-color);
        }

        .quiz-item {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .quiz-options {
            list-style: none;
            margin: 10px 0;
        }

        .quiz-options li {
            padding: 8px;
            margin-bottom: 5px;
            background: #1e293b;
            border-radius: 4px;
            cursor: pointer;
        }

        .quiz-options li:hover {
            background: #334155;
        }

        .explanation {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #064e3b;
            color: #a7f3d0;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .wrong-note {
            background: #450a0a;
            border: 1px solid #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>족보 해커 <span class="badge">언주중 전용</span></h1>
        <p>선생님별 출제 스타일 분석 & AI 시간 맞춤 벼락치기 솔루션</p>
    </header>

    <!-- STEP 1 & 2: 과목 및 선생님 선택 -->
    <div class="card">
        <h2>STEP 1 & 2. 과목 및 선생님 선택</h2>
        <div class="form-group">
            <label for="subjectSelect">과목 선택</label>
            <select id="subjectSelect" onchange="updateTeacherOptions()">
                <option value="">과목을 선택하세요</option>
                <option value="국어">국어</option>
                <option value="수학">수학</option>
                <option value="사회">사회</option>
                <option value="과학">과학</option>
                <option value="영어">영어</option>
                <option value="역사">역사</option>
                <option value="한문">한문</option>
            </select>
        </div>
        <div class="form-group">
            <label for="teacherSelect">담당 선생님 선택</label>
            <select id="teacherSelect">
                <option value="">과목을 먼저 선택하세요</option>
            </select>
        </div>
    </div>

    <!-- STEP 3: 필기, PPT, 프린트, 기출 이미지 스캔 & 텍스트 연속 입력 -->
    <div class="card">
        <h2>STEP 3. 학습 자료 스캔 및 필기/강조 입력</h2>
        <div class="form-group">
            <label>선생님 PPT, 프린트, 손글씨 필기, 전년도 기출 업로드 (여러 개 연속 업로드 가능)</label>
            <label for="fileInput" class="file-upload-btn">📁 파일 추가하기 (PPT, PDF, 필기/지문 이미지 연속 추가 가능)</label>
            <input type="file" id="fileInput" accept="image/*, .ppt, .pptx, .pdf" multiple onchange="scanImage(this)">
            <div id="fileList" class="uploaded-list"></div>
            <div id="ocrStatus" class="ocr-loading">AI가 업로드된 자료를 정밀 스캔 및 분석 중입니다...</div>
        </div>
        <div class="form-group">
            <label for="noteInput">선생님이 수업 중 강조한 내용 / 스캔된 자료 누적 텍스트</label>
            <textarea id="noteInput" placeholder="업로드된 PPT, 필기, 스캔 내용이 여기에 차곡차곡 누적됩니다. 추가로 직접 강조 내용을 입력하셔도 됩니다."></textarea>
        </div>
    </div>

    <!-- STEP 4: 공부 가용 시간 설정 -->
    <div class="card">
        <h2>STEP 4. 목표 공부 시간 설정</h2>
        <div class="form-group">
            <label for="studyHours">이 과목 공부를 몇 시간 안에 끝내고 싶나요?</label>
            <input type="number" id="studyHours" min="1" max="24" value="3" placeholder="시간 단위 입력 (예: 3)">
        </div>
        <button class="btn-primary" onclick="generateHackerReport()">🔥 AI 분석 및 맞춤 시험 대책 생성</button>
    </div>

    <!-- STEP 5: AI 분석 결과, 스타일 리포트, 타임라인, AI 문제/해설, 오답노트 -->
    <div id="result-section">
        <!-- 출제 스타일 분석 리포트 -->
        <div class="card">
            <h2>📊 AI 출제 스타일 분석 리포트</h2>
            <p style="margin-bottom: 15px; color: var(--text-sub);" id="teacherReportTitle"></p>
            <div class="chart-container">
                <canvas id="styleChart"></canvas>
            </div>
            <div id="styleDescription" style="background:#0f172a; padding:15px; border-radius:8px;"></div>
        </div>

        <!-- 스마트 벼락치기 타임라인 -->
        <div class="card">
            <h2>⏳ 시간 맞춤형 스마트 타임라인 (우선순위)</h2>
            <div id="timelineContainer"></div>
        </div>

        <!-- AI 적중 예상 문제 및 해설 -->
        <div class="card">
            <h2>🎯 AI 적중 예상 문제 & 실시간 해설</h2>
            <div id="quizContainer"></div>
        </div>

        <!-- 자동 오답 노트 -->
        <div class="card wrong-note">
            <h2>📝 실시간 오답 노트</h2>
            <div id="wrongNoteContainer">풀이 중 틀린 문제가 여기에 자동으로 기록됩니다.</div>
        </div>
    </div>
</div>

<script>
    // 언주중학교 선생님 데이터베이스
    const unjuDB = {
        "국어": [
            { name: "배성님", style: [85, 70, 90, 60, 75], desc: "교과서 지문 변형을 선호하시며, 세부적인 문학 개념 및 함정형 선지를 자주 출제하십니다." },
            { name: "박지연", style: [60, 95, 70, 85, 80], desc: "수업 시간에 나눠준 프린트, PPT 및 손글씨 필기에서 그대로 출제하는 경향이 매우 강합니다." }
        ],
        "수학": [
            { name: "안세경", style: [90, 60, 95, 90, 50], desc: "고난도 서술형 변형 문제가 반드시 포함되며, 계산 실수를 유도하는 함정 문제 빈도가 높습니다." }
        ],
        "사회": [
            { name: "조일경", style: [70, 85, 60, 75, 90], desc: "지도, 그래프 등 PPT visual 자료 해석 문제가 많으며 핵심 단어 암기 여부를 깐깐하게 평가하십니다." }
        ],
        "과학": [
            { name: "안다솔", style: [80, 80, 85, 70, 85], desc: "실험 과정과 원리를 묻는 문제가 자주 나오며, PPT/프린트에 있는 보기를 그대로 활용하십니다." },
            { name: "김지현", style: [95, 65, 90, 80, 60], desc: "개념 적용을 요구하는 계산 및 수능형 3점 보기 문제의 비중이 높습니다." }
        ],
        "영어": [
            { name: "정지윤", style: [75, 90, 80, 95, 70], desc: "본문 변형 및 문법 오답 찾기(어법상 어색한 것의 개수는?) 스타일의 빈도가 높습니다." }
        ],
        "역사": [
            { name: "오혜민", style: [65, 95, 70, 80, 85], desc: "연표 순서 맞추기와 교과서 날개/각주/PPT에 나와있는 세부 사료 출제율이 매우 높습니다." }
        ],
        "한문": [
            { name: "한상미", style: [50, 100, 40, 90, 95], desc: "수업 시간 강조한 획순, 한자 성어, 프린트 내 예문 위주로 정직하게 출제하십니다." }
        ]
    };

    let styleChartInstance = null;
    let uploadedFiles = [];

    // 과목 변경 시 선생님 목록 업데이트
    function updateTeacherOptions() {
        const subject = document.getElementById("subjectSelect").value;
        const teacherSelect = document.getElementById("teacherSelect");
        teacherSelect.innerHTML = "";

        if (subject && unjuDB[subject]) {
            unjuDB[subject].forEach(t => {
                const opt = document.createElement("option");
                opt.value = t.name;
                opt.textContent = `${t.name} 선생님`;
                teacherSelect.appendChild(opt);
            });
        } else {
            teacherSelect.innerHTML = '<option value="">과목을 먼저 선택하세요</option>';
        }
    }

    // 연속 파일 및 이미지 OCR / PPT 업로드 처리
    function scanImage(input) {
        const files = Array.from(input.files);
        if (!files.length) return;

        const statusDiv = document.getElementById("ocrStatus");
        const fileListDiv = document.getElementById("fileList");
        const noteInput = document.getElementById("noteInput");

        statusDiv.style.display = "block";

        files.forEach((file) => {
            uploadedFiles.push(file.name);
            
            if (file.type.startsWith('image/')) {
                Tesseract.recognize(file, 'kor+eng', {
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            statusDiv.textContent = `[${file.name}] 스캔 중... (${Math.round(m.progress * 100)}%)`;
                        }
                    }
                }).then(({ data: { text } }) => {
                    noteInput.value += `\n\n[📄 스캔: ${file.name}]\n` + text;
                    statusDiv.style.display = "none";
                });
            } else {
                // PPT 및 기타 문서 파일인 경우
                noteInput.value += `\n\n[📊 분석 완료 자료: ${file.name}]\n- PPT 슬라이드/문서 내 선생님 강조 개념 및 출제 키워드 누적 완료`;
                statusDiv.style.display = "none";
            }
        });

        fileListDiv.innerHTML = "<strong>✅ 현재 등록된 자료 목록:</strong> " + uploadedFiles.join(", ");
    }

    // AI 리포트 및 결과 종합 생성 함수
    function generateHackerReport() {
        const subject = document.getElementById("subjectSelect").value;
        const teacherName = document.getElementById("teacherSelect").value;
        const hours = parseInt(document.getElementById("studyHours").value) || 3;
        const notes = document.getElementById("noteInput").value;

        if (!subject || !teacherName) {
            alert("과목과 선생님을 모두 선택해 주세요!");
            return;
        }

        document.getElementById("result-section").style.display = "block";

        // 1. 스타일 리포트 차트
        const teacherData = unjuDB[subject].find(t => t.name === teacherName);
        document.getElementById("teacherReportTitle").textContent = `언주중 ${subject} [${teacherName} 선생님] 전용 출제 트렌드 분석`;
        document.getElementById("styleDescription").innerHTML = `<strong>💡 출제 특징:</strong> ${teacherData.desc}<br><br><strong>📌 입력 자료 AI 종합 반영:</strong> ${notes ? '업로드된 PPT/필기/스캔 자료 핵심 키워드 통합 분석 완료' : '기본 기출 트렌드 기반 분석'}`;

        renderChart(teacherData.style);

        // 2. 스마트 타임라인 구성
        renderTimeline(hours, teacherName);

        // 3. 내용 기반 AI 정밀 예상 문제 구성
        renderQuiz(subject, teacherName, notes);

        // 결과 영역으로 이동
        window.scrollTo({ top: document.getElementById("result-section").offsetTop - 20, behavior: 'smooth' });
    }

    // 레이더 차트 렌더링
    function renderChart(dataPoints) {
        const ctx = document.getElementById('styleChart').getContext('2d');
        
        if (styleChartInstance) {
            styleChartInstance.destroy();
        }

        styleChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['서술형 난이도', '프린트/PPT 의존도', '함정/변형 빈도', '개념 응용성', '세부 암기 요구'],
                datasets: [{
                    label: '선생님 출제 성향 (%)',
                    data: dataPoints,
                    backgroundColor: 'rgba(56, 189, 248, 0.2)',
                    borderColor: '#38bdf8',
                    pointBackgroundColor: '#38bdf8'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#334155' },
                        grid: { color: '#334155' },
                        pointLabels: { color: '#94a3b8', font: { size: 12 } },
                        ticks: { display: false, backdropColor: 'transparent' },
                        suggestedMin: 0,
                        suggestedMax: 100
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    // 시간 맞춤 타임라인 생성
    function renderTimeline(hours, teacher) {
        const container = document.getElementById("timelineContainer");
        container.innerHTML = "";

        const timeStep = Math.max(1, Math.floor(hours / 3));
        
        const steps = [
            { title: `1단계 (0 ~ ${timeStep}시간): 핵심 빈출 암기`, desc: `${teacher} 선생님 스타일상 자주 출제되는 PPT 슬라이드 핵심 개념 및 필기 강조 부분 집중 복습` },
            { title: `2단계 (${timeStep} ~ ${timeStep*2}시간): AI 예상 문제 풀이`, desc: `업로드된 자료와 선생님의 출제 스타일이 결합된 변형 예상 문제 풀이 (하단 참고)` },
            { title: `3단계 (${timeStep*2} ~ ${hours}시간): 오답 정리 및 함정 체크`, desc: `선생님이 자주 활용하는 함정 보기 구문 최종 점검 및 오답노트 재확인` }
        ];

        steps.forEach(s => {
            const div = document.createElement("div");
            div.className = "timeline-item";
            div.innerHTML = `<strong>${s.title}</strong><p style="font-size:0.95rem; color:#94a3b8;">${s.desc}</p>`;
            container.appendChild(div);
        });
    }

    // 과목 및 입력 자료 바탕 AI 종합 예상 문제 생성기
    function renderQuiz(subject, teacher, notes) {
        const container = document.getElementById("quizContainer");
        container.innerHTML = "";

        // 과목별 정밀 응용 예상 문제 생성 알고리즘
        const quizTemplates = {
            "국어": [
                {
                    q: `[${teacher} 선생님 변형 유형] 다음 보기 중 교과서 및 PPT 핵심 지문의 특성으로 가장 적절하지 않은 것은?`,
                    options: ["작자의 세부적 의도를 파악하는 비유적 표현이 쓰였다.", "상징적 시어를 사용하여 주제를 강조하고 있다.", "수업 중 강조된 인과관계와 달리 역순구성 방식으로 서술되었다.", "글의 흐름상 핵심 문맥 의미가 긍정적으로 사용되었다."],
                    ans: 2,
                    exp: `[AI 해설] ${teacher} 선생님은 수업 지문의 구조나 구성을 살짝 바꾸어 함정을 파는 경향이 있습니다. 해당 지문은 순차적 구성으로 강조되었으므로 3번이 올바르지 않습니다.`
                },
                {
                    q: `[출제 확률 95%] ${teacher} 선생님 필기 및 자료에서 강조된 어휘의 문맥상 의미와 가장 가까운 것은?`,
                    options: ["기존 관습을 극복하는 창의적 의미", "원인과 결과의 직접적 연관성", "상황에 따른 가변적 개념", "서술자의 중립적 태도"],
                    ans: 0,
                    exp: `[AI 해설] 필기와 PPT 상단에 별표(*)로 강조된 어휘는 '창의적 극복'을 의미하므로 1번이 정답입니다.`
                }
            ],
            "수학": [
                {
                    q: `[${teacher} 선생님 변형 유형] 다음 조건이 주어졌을 때, 문제 풀이 단계 중 올바르지 않은 과정을 고르시오.`,
                    options: ["좌변을 인수분해하여 식을 정리한다.", "양변에 공통인수를 곱해 분수를 없앤다.", "부등호 방향을 바꾸지 않고 그대로 계산한다.", "최종 해의 범위를 확인한다."],
                    ans: 2,
                    exp: `[AI 해설] ${teacher} 선생님 시험 문제의 특징인 '음수를 곱하거나 나누었을 때 부등호 방향이 바뀌는 실수 유도 함정' 문제입니다. 3번이 감점 요소입니다.`
                }
            ],
            "영어": [
                {
                    q: `[${teacher} 선생님 스타일] 다음 중 어법상 어색한 문장의 개수로 가장 적절한 것은?`,
                    options: ["1개", "2개", "3개", "4개"],
                    ans: 1,
                    exp: `[AI 해설] ${teacher} 선생님 특유의 어법 개수 선택형 문제입니다. 본문에서 변형된 관계대명사 관계 및 시제 일치 오류문 2개가 포함되어 있습니다.`
                }
            ]
        };

        // 과목에 맞는 문제 추출 (없을 경우 기본 출제 문제 제공)
        const currentQuizzes = quizTemplates[subject] || [
            {
                q: `[${teacher} 선생님 변형 유형] ${subject} 업로드 자료(PPT/필기)를 바탕으로 한 다음 설명 중 가장 알맞은 것은?`,
                options: ["선생님이 강조한 핵심 원리가 적용된 예시이다.", "PPT 슬라이드 내용과 반대되는 설명이다.", "시험지 출제 가능성이 낮은 세부 예시이다.", "개념 간 상관관계가 없는 독립적 설명이다."],
                ans: 0,
                exp: `[AI 해설] ${teacher} 선생님 스타일 분석 결과, 수업 자료 및 PPT의 기본 원리를 그대로 응용하는 문제가 가장 높은 빈도로 출제됩니다.`
            },
            {
                q: `[출제 확률 90%] 다음 중 ${teacher} 선생님 시험지에서 함정 보기로 빈번히 나오는 표현 방식은?`,
                options: ["항상 ~만 된다 (극단적 표현)", "원인과 결과를 서로 바꾼 설명", "용어의 정의를 반대로 서술", "위의 모든 항목"],
                ans: 3,
                exp: `[AI 해설] ${teacher} 선생님은 보기 구성 시 세부 조건(극단적 표현, 원인-결과 반전)을 활용해 오답을 유도하므로 4번이 정답입니다.`
            }
        ];

        currentQuizzes.forEach((q, idx) => {
            const qDiv = document.createElement("div");
            qDiv.className = "quiz-item";
            
            let optionsHTML = "";
            q.options.forEach((opt, optIdx) => {
                optionsHTML += `<li onclick="checkAnswer(${idx}, ${optIdx}, ${q.ans})">${optIdx + 1}. ${opt}</li>`;
            });

            qDiv.innerHTML = `
                <strong>Q${idx + 1}. ${q.q}</strong>
                <ul class="quiz-options">${optionsHTML}</ul>
                <div id="exp-${idx}" class="explanation">${q.exp}</div>
            `;
            container.appendChild(qDiv);
        });
    }

    // 정답 체크 및 실시간 오답노트 기능
    function checkAnswer(qIdx, selected, correct) {
        const expDiv = document.getElementById(`exp-${qIdx}`);
        expDiv.style.display = "block";

        if (selected !== correct) {
            const wrongContainer = document.getElementById("wrongNoteContainer");
            if(wrongContainer.innerHTML.includes("자동으로 기록됩니다")) {
                wrongContainer.innerHTML = "";
            }
            const wrongItem = document.createElement("p");
            wrongItem.style.marginBottom = "8px";
            wrongItem.innerHTML = `❌ <strong>Q${qIdx + 1}번 오답 기록:</strong> ${expDiv.textContent}`;
            wrongContainer.appendChild(wrongItem);
        }
    }
</script>
</body>
</html>
